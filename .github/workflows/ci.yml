name: CI

on:
  pull_request:
  push:

permissions: read-all

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Set up uv
        uses: astral-sh/setup-uv@v9.0.0
        with:
          version: "latest"

      - name: Run tests
        run: make test

  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Set up uv
        uses: astral-sh/setup-uv@v9.0.0
        with:
          version: "latest"

      - name: Run lint
        run: make lint

  build:
    runs-on: ubuntu-latest
    needs: [test, lint, bats]
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Set up uv
        uses: astral-sh/setup-uv@v9.0.0
        with:
          version: "latest"

      - name: Build binary
        run: make build

      - name: Verify binary version
        run: utils/check_binary_version.sh

      # Published so the end-to-end job can test these exact bits rather than
      # rebuilding its own. Same commit, same command — but a rebuild would
      # not prove the artifact survives the upload/download round trip, and
      # that round trip is what the release downloads too.
      - name: Publish binary
        uses: actions/upload-artifact@v7
        with:
          name: jeeves-zipapp
          path: dist/jeeves
          if-no-files-found: error

  bats:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # bats arrives through npx, so node is the only prerequisite. The suite
      # itself is offline: every script it drives has its collaborators stubbed.
      - name: Run the shell test suite
        run: make bats

  # What version would merging this actually release? The release job only runs
  # on pushes to main, so without this the answer arrives after the tag has been
  # cut. In the sibling breakfast repo a commit marked itself breaking with a
  # bang after its conventional type, which is correct Conventional Commits and
  # also an instruction to bump the major version: 0.107.1 shipped as 1.0.0 and
  # nobody saw it coming. This also means a malformed mkver.conf fails here
  # rather than on main.
  version:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          # mkver reads the whole history and every tag to find the last
          # release and the commits since it. The default shallow clone has
          # neither.
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Install git-mkver
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: utils/install_git_mkver.sh

      - name: Report the version this would release
        run: utils/report_next_version.sh

  spell:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up uv
        uses: astral-sh/setup-uv@v9.0.0
        with:
          version: "latest"

      # `make spell` rather than the crate-ci/typos action, so the version
      # pinned in the Makefile is the one that runs both here and locally.
      - name: Check spelling
        run: make spell

  docs-lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Lint markdown docs
        run: make docs-lint

  man:
    runs-on: ubuntu-latest
    needs: [test, lint, spell, docs-lint]
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Set up uv
        uses: astral-sh/setup-uv@v9.0.0
        with:
          version: "latest"

      - name: Generate man page
        run: make man

      - name: Verify man page
        run: |
          test -f man1/jeeves.1.gz
          man -l man1/jeeves.1.gz | head -1 | grep -q "jeeves"

  completions:
    runs-on: ubuntu-latest
    needs: [test, lint, bats]
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Set up uv
        uses: astral-sh/setup-uv@v9.0.0
        with:
          version: "latest"

      - name: Generate completion scripts
        run: make completions

      - name: Install zsh and fish
        run: sudo apt-get install -y zsh fish

      - name: Verify completion scripts exist and source cleanly
        run: |
          test -f completions/jeeves.bash
          test -f completions/_jeeves
          test -f completions/jeeves.fish
          source completions/jeeves.bash && complete -p jeeves
          zsh -i -c "autoload -Uz compinit && compinit -u && source completions/_jeeves && echo 'zsh ok'"
          fish -c "source completions/jeeves.fish && echo 'fish ok'"

      - name: Verify completions subcommand works for all shells
        run: |
          uv run jeeves completions bash | grep -q "_JEEVES_COMPLETE"
          uv run jeeves completions zsh | grep -q "_JEEVES_COMPLETE"
          uv run jeeves completions fish | grep -q "_JEEVES_COMPLETE"

  e2e:
    name: End-to-end
    runs-on: ubuntu-latest
    needs: [build]
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Set up uv
        uses: astral-sh/setup-uv@v9.0.0
        with:
          version: "latest"

      # Into dist/, which is where JEEVES_E2E_BINARY defaults to looking.
      - name: Download binary
        uses: actions/download-artifact@v8
        with:
          name: jeeves-zipapp
          path: dist

      # Artifacts travel as zips, which do not preserve the executable bit.
      - name: Restore executable bit
        run: chmod +x dist/jeeves

      # Docker is preinstalled on ubuntu-latest, which is why the suite's
      # container runtime seam prefers it: the local run then matches CI
      # rather than diverging from it.
      - name: Report the container runtime
        run: docker version --format 'server {{.Server.Version}}'

      # e2e-ci deliberately does not rebuild: it runs the downloaded artifact.
      # Both REQUIRE flags are set, so a missing binary and an unreachable
      # container are failures rather than skips, and the test-count check
      # catches any future skip nobody remembered to gate.
      - name: Run end-to-end suite
        run: make e2e-ci

      # The container logs are the only way to diagnose a Jenkins that failed
      # to boot, and they are gone once the job ends.
      - name: Jenkins container logs on failure
        if: failure()
        run: |
          for c in $(docker ps -aq --filter "name=jeeves-e2e"); do
            echo "=== $c ==="
            docker logs "$c" 2>&1 | tail -100
          done

  release:
    if: "github.ref == 'refs/heads/main' && github.event_name == 'push' && !startsWith(github.event.head_commit.message, 'chore: bump version')"
    runs-on: ubuntu-latest
    needs: [build, e2e, man, completions]
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          token: ${{ secrets.GH_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Set up uv
        uses: astral-sh/setup-uv@v9.0.0
        with:
          version: "latest"

      - name: Install git-mkver
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: utils/install_git_mkver.sh

      - name: Fetch tags
        run: git fetch --tags

      - name: Read version
        id: version
        run: echo "version=$(python utils/read_version.py)" >> "$GITHUB_OUTPUT"

      - name: Bump version if tag exists
        id: bump
        run: |
          version="$(utils/bump_version_if_tag_exists.sh "${{ steps.version.outputs.version }}")"
          echo "version=${version}" >> "$GITHUB_OUTPUT"

      - name: Build binary
        run: make release

      - name: Generate man page
        run: make man

      - name: Generate completion scripts
        run: make completions

      - name: Create release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: utils/create_release.sh "${{ steps.bump.outputs.version }}"

  verify-release:
    if: "github.ref == 'refs/heads/main' && github.event_name == 'push' && !startsWith(github.event.head_commit.message, 'chore: bump version')"
    runs-on: ubuntu-latest
    needs: release
    steps:
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Install latest release
        run: |
          curl -sSL https://raw.githubusercontent.com/${{ github.repository }}/${{ github.sha }}/install.sh | bash

      - name: Verify installation
        run: ~/.local/bin/jeeves --version

      - name: Install zsh and fish
        run: sudo apt-get install -y zsh fish

      - name: Verify bash completions
        run: |
          source ~/.local/share/bash-completion/completions/jeeves
          complete -p jeeves

      - name: Verify zsh completions
        run: zsh -i -c "autoload -Uz compinit && compinit -u && source ~/.local/share/zsh/site-functions/_jeeves && echo 'zsh ok'"

      - name: Verify fish completions
        run: fish -c "source ~/.config/fish/completions/jeeves.fish && echo 'fish ok'"
